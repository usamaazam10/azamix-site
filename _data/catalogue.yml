# The kinds of software Azamix builds, grouped by category.
# Shown as a tabbed explorer on the homepage and as a full list on /services/.
# Only list types of software Azamix is prepared to deliver. `links` point to the related service pages.

- key: operations
  name: Business operations
  tagline: Run the business from one place.
  blurb: Systems for the work that happens behind the scenes, replacing spreadsheets, email chains and disconnected tools.
  icon: <rect x="3" y="3" width="6" height="6" rx="1"/><rect x="11" y="3" width="6" height="6" rx="1"/><rect x="3" y="11" width="6" height="6" rx="1"/><rect x="11" y="11" width="6" height="6" rx="1"/>
  links:
    - { name: Custom software, url: /services/custom-software/ }
  items:
    - { name: ERP-style operations systems, desc: "Orders, stock, purchasing and finance in one connected system." }
    - { name: CRM and sales pipelines, desc: "Leads, deals and customer history, built around how you sell." }
    - { name: Inventory and warehouse management, desc: "Stock levels, locations, transfers and reorder alerts." }
    - { name: HR and staff management, desc: "Onboarding, leave, shifts, timesheets and staff documents." }
    - { name: Approvals and procurement, desc: "Purchase requests, approval chains and spend tracking." }
    - { name: Field service management, desc: "Jobs, scheduling, on-site checklists and sign-off." }

- key: customers
  name: Customer-facing apps
  tagline: Meet your customers where they are.
  blurb: Web and mobile products your customers use directly, from the first visit to the hundredth order.
  icon: <rect x="6" y="2.5" width="8" height="15" rx="1.8"/><path d="M9.5 14.5h1"/>
  links:
    - { name: Mobile apps, url: /services/mobile-apps/ }
    - { name: Web applications, url: /services/web-applications/ }
  items:
    - { name: E-commerce and online ordering, desc: "Stores, catalogues, carts and checkout, on the web or in an app." }
    - { name: Booking and scheduling, desc: "Appointments, classes, rentals and automatic reminders." }
    - { name: Customer portals, desc: "Self-service accounts, invoices, documents and requests." }
    - { name: Delivery and tracking apps, desc: "Live order status, driver apps and proof of delivery." }
    - { name: Loyalty and membership apps, desc: "Points, rewards, memberships and member-only content." }
    - { name: Marketplaces, desc: "Two-sided platforms connecting buyers and sellers, or clients and providers." }

- key: platforms
  name: SaaS and platforms
  tagline: Build a product you can sell.
  blurb: Software products with accounts, plans and billing, from a first version that tests the idea to a platform that grows.
  icon: <path d="M10 3l7 3.5-7 3.5-7-3.5L10 3z"/><path d="M3 10l7 3.5 7-3.5M3 13.5l7 3.5 7-3.5"/>
  links:
    - { name: Web applications, url: /services/web-applications/ }
  items:
    - { name: SaaS products, desc: "Multi-tenant applications with plans, billing and team accounts." }
    - { name: MVPs for startups, desc: "A focused first version to test the idea with real users." }
    - { name: Learning management systems, desc: "Courses, enrolment, progress tracking and certificates." }
    - { name: Subscription and billing platforms, desc: "Recurring payments, invoices and plan management." }
    - { name: Community and social apps, desc: "Profiles, feeds, messaging and moderation tools." }
    - { name: Admin and back-office panels, desc: "The internal tools that run your product behind the scenes." }

- key: ai
  name: Data and AI
  tagline: Turn information into action.
  blurb: Reporting, search and automation that put the data you already have to work, with people in control where it matters.
  icon: <path d="M10 2.5l1.8 4.2 4.2 1.8-4.2 1.8L10 14.5l-1.8-4.2L4 8.5l4.2-1.8L10 2.5z"/><path d="M15.5 13l.8 1.7 1.7.8-1.7.8-.8 1.7-.8-1.7-1.7-.8 1.7-.8.8-1.7z"/>
  links:
    - { name: AI and automation, url: /services/ai-automation/ }
  items:
    - { name: Dashboards and business intelligence, desc: "Live reporting from the data you already have." }
    - { name: AI assistants and chatbots, desc: "Answers drawn from your own documents, with sources shown." }
    - { name: Document processing, desc: "Data extracted from invoices, forms and contracts, with review." }
    - { name: Workflow automation, desc: "Scheduled jobs and triggers that remove repetitive steps." }
    - { name: Smart search, desc: "Find the right record or document by asking in plain language." }
    - { name: Classification and routing, desc: "Emails, tickets and requests sorted to the right place." }

- key: connect
  name: Integrations and modernisation
  tagline: Make what you already have work better.
  blurb: Connecting the systems you rely on, moving off old ones, and keeping everything running after launch.
  icon: <path d="M7 6l-4 4 4 4M13 6l4 4-4 4"/>
  links:
    - { name: APIs and integrations, url: /services/api-integrations/ }
    - { name: Cloud and support, url: /services/cloud-devops/ }
  items:
    - { name: API development, desc: "Documented APIs for your apps, partners and integrations." }
    - { name: Third-party integrations, desc: "Payments, accounting, CRM, maps, messaging and more." }
    - { name: Data migration, desc: "Move off spreadsheets or old systems without losing history." }
    - { name: Legacy system modernisation, desc: "Improve or rebuild old systems in stages, while the business keeps running." }
    - { name: Cloud migration and DevOps, desc: "Move applications to the cloud, with automated deployments." }
    - { name: Maintenance and support, desc: "Updates, monitoring and improvements after launch." }
