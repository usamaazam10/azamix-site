# GitHub Pages builds this repo with Jekyll (the same version as the Gemfile pins).
# Pages, articles and shared header/footer are assembled from _layouts and _includes.
title: Azamix
tagline: Software built around how your business actually works.
description: >-
  Azamix is a software development company. We design and build custom business software,
  mobile apps, web platforms, practical AI integrations and system integrations.
url: https://azamix.com
email: usamaazam10@gmail.com
phone: "+92 342 6147283"
phone_href: "+923426147283"

# Project inquiry delivery. Empty: the form opens the visitor's email app, pre-filled.
# Set to a form-backend URL that accepts JSON (e.g. "https://formspree.io/f/xxxxxxx")
# to send inquiries directly. See README.md.
form_endpoint: ""

theme: null # no default theme: stops Pages adding an unused assets/css/style.css
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

# Insights (a future publication) is switched off: the index and feed are excluded below,
# and /insights/ redirects to the homepage (moved-insights.html). Drafts stay in _drafts/,
# which the live site never builds. To launch it, follow "Launching Insights" in EDITORIAL.md.
insights: false
permalink: /insights/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article
      nav: insights

# Keep repo-only files off the live site.
exclude:
  - README.md
  - CLAIMS-AUDIT.md
  - BRAND.md
  - EDITORIAL.md
  - .claude
  - Gemfile
  - Gemfile.lock
  - vendor
  - tools
  # Insights is not live yet (see `insights: false` above)
  - insights
  - feed.xml
